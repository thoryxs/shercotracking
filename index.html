<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: één kolom als een motordashboard. Bewust donker (Blackmoon), racing-oranje accent. De opwarmtimer neemt het hele scherm over. */
:root {
  color-scheme: dark;
  --bg: #0b0b0d; --black: #000000; --surface: #16161a; --surface-2: #1e1e24; --fg: #f2f2f4; --muted: #8f909a; --line: #2a2a31;
  --accent: #ff5a1f; --accent-ink: #0b0b0d; --done: #39d27a; --done-bg: #10261a; --red: #ff2d3d; --tip-bg: #221a10; --tip-fg: #ffc46b;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  --mono: "Share Tech Mono", ui-monospace, monospace;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body.locked { overflow: hidden; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 3px solid var(--accent); position: relative; }
.head::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 3px; background: repeating-linear-gradient(90deg, var(--fg) 0 6px, transparent 6px 12px); opacity: .25; }
h1 { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 2.6rem; letter-spacing: .01em; text-transform: uppercase; margin: 0; line-height: .9; }
h1 span { color: var(--accent); }
.model { font-family: var(--mono); color: var(--muted); font-size: .8rem; text-align: right; line-height: 1.3; }

.tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 22px; }
.tab { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .03em; border: 1px solid var(--line); border-radius: 4px; padding: 10px 8px; background: var(--surface); color: var(--muted); cursor: pointer; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab:focus-visible, .row:focus-within, .btn:focus-visible, .mode:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

.bar { display: flex; align-items: center; gap: 12px; margin: 18px 0 4px; }
.track { flex: 1; height: 10px; background: var(--surface-2); overflow: hidden; transform: skewX(-20deg); }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--done), var(--done) 70%, var(--accent)); transition: width .3s; }
.count { font-family: var(--mono); color: var(--muted); font-size: 1rem; min-width: 3.5em; text-align: right; }

.group { margin-top: 20px; }
.group h2 { font-family: var(--display); font-weight: 700; font-size: .95rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.list { display: grid; gap: 6px; }
.row { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 4px; padding: 12px 14px; cursor: pointer; transition: background .2s, border-color .2s; }
.row input { -webkit-appearance: none; appearance: none; flex: none; width: 26px; height: 26px; margin: 0; border: 2px solid var(--muted); border-radius: 50%; display: grid; place-content: center; cursor: pointer; }
.row input:checked { background: var(--done); border-color: var(--done); }
.row input:checked::after { content: ""; width: 6px; height: 12px; border: solid var(--bg); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.row.checked { background: var(--done-bg); border-left-color: var(--done); }
.row.checked .what { text-decoration: line-through; color: var(--muted); }
.txt { min-width: 0; }
.what { font-weight: 600; }
.why { color: var(--muted); font-size: .88rem; }
.row.lock .what::before { content: "SLOT"; font-family: var(--display); font-weight: 700; font-size: .72rem; letter-spacing: .1em; background: var(--red); color: var(--fg); border-radius: 2px; padding: 1px 5px; margin-right: 7px; vertical-align: 2px; }

/* Opwarmkaart in de lijst */
.warm { background: radial-gradient(120% 90% at 50% 0%, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 12px; margin-bottom: 6px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mode { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 4px; padding: 8px 4px; cursor: pointer; display: grid; gap: 2px; font: inherit; }
.mode b { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .03em; color: var(--fg); }
.mode span { font-family: var(--mono); font-size: .85rem; }
.mode[aria-checked="true"] { border-color: var(--accent); background: var(--tip-bg); }
.mode[aria-checked="true"] span { color: var(--accent); }
.warm p { margin: 0; color: var(--muted); font-size: .88rem; }
.btn { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 1.25rem; letter-spacing: .06em; text-transform: uppercase; border: 0; border-radius: 4px; padding: 13px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }

/* Fullscreen timer */
.ov { position: fixed; inset: 0; z-index: 50; background: var(--black); opacity: 0; transition: opacity .8s ease; display: grid; place-items: center; overflow: hidden;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); --p: 0; }
.ov.show { opacity: 1; }
.ov > canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ov-glow { position: absolute; inset: -10%; pointer-events: none; background: radial-gradient(circle at 50% 42%, var(--accent), transparent 55%); opacity: calc(var(--p) * .38); }
.ov.finished .ov-glow { background: radial-gradient(circle at 50% 42%, var(--done), transparent 55%); opacity: .35; }
.ov-in { position: relative; display: grid; justify-items: center; gap: 14px; width: min(100%, 520px); text-align: center; }
.ov-mode { font-family: var(--display); font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); font-size: .9rem; }
.ov svg { width: 100%; max-height: 34vh; display: block; overflow: visible; }
.ov .tick { stroke: var(--muted); stroke-width: 2; }
.ov .tick.red { stroke: var(--red); }
.ov .num { fill: var(--muted); font-family: var(--mono); font-size: 13px; text-anchor: middle; }
.ov .arc-bg { fill: none; stroke: var(--surface-2); stroke-width: 14; }
.ov .arc { fill: none; stroke: var(--accent); stroke-width: 14; }
.ov .needle { stroke: var(--red); stroke-width: 4; stroke-linecap: round; }
.ov .hub { fill: var(--fg); }
.ov .time { fill: var(--fg); font-family: var(--mono); font-size: 40px; text-anchor: middle; }
.ov .lbl { fill: var(--muted); font-family: var(--display); font-weight: 700; letter-spacing: .15em; font-size: 12px; text-anchor: middle; }
.ov.finished .arc { stroke: var(--done) !important; }
.ov.finished .time { fill: var(--done); font-family: var(--display); font-weight: 800; font-style: italic; font-size: 64px; }
.leds { display: flex; gap: 8px; }
.led { width: 64px; height: 10px; background: var(--surface-2); transform: skewX(-20deg); transition: background .4s, box-shadow .4s; }
.led.on { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.led.cur { animation: blink .7s infinite alternate; }
.ov.finished .led { background: var(--done); box-shadow: 0 0 14px var(--done); animation: none; }
@keyframes blink { to { opacity: .35; } }
.stage { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 1.6rem; letter-spacing: .04em; line-height: 1; }
.ov.finished .stage { color: var(--done); font-size: 2.2rem; }
.ov-msg { margin: 0; color: var(--muted); max-width: 34ch; min-height: 2.9em; }
.ov .btn { width: 100%; max-width: 320px; }
.ov .btn.stop { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.ov.finished .btn.stop { background: var(--done); color: var(--accent-ink); border-color: var(--done); }
.flagstrip { height: 22px; width: 100%; background: conic-gradient(var(--fg) 25%, var(--black) 0 50%, var(--fg) 0 75%, var(--black) 0) 0 0 / 22px 22px; animation: wave 1s linear infinite; }

/* Finish onder de lijst */
.ready { margin-top: 18px; border-radius: 6px; overflow: hidden; border: 1px solid var(--done); }
.flag { height: 28px; background: conic-gradient(var(--fg) 25%, var(--bg) 0 50%, var(--fg) 0 75%, var(--bg) 0) 0 0 / 28px 28px; animation: wave 1.2s linear infinite; }
@keyframes wave { to { background-position: 28px 0; } }
.ready .msg { background: var(--done-bg); padding: 14px; text-align: center; }
.ready .big { display: block; font-family: var(--display); font-weight: 800; font-style: italic; font-size: 1.9rem; text-transform: uppercase; color: var(--done); line-height: 1; }
.ready .small { color: var(--fg); font-size: .95rem; }
.ready:not([hidden]) { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.92); opacity: .4; } to { transform: none; opacity: 1; } }

.tip { margin-top: 16px; padding: 12px 14px; border-radius: 4px; background: var(--tip-bg); color: var(--tip-fg); font-size: .9rem; border-left: 4px solid var(--tip-fg); }
.reset { margin-top: 18px; width: 100%; padding: 12px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 600 1rem var(--body); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .fill, .row, .ov, .led { transition: none; } .flag, .flagstrip, .led.cur, .ready:not([hidden]) { animation: none; } }
html { background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
[hidden] { display: none !important; }
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body, .ov { touch-action: manipulation; }
.ov { padding-top: 16px; padding-bottom: 16px; }
h1 { display: flex; align-items: center; gap: 10px; }
.logo { width: 40px; height: 40px; border-radius: 10px; }
.mpick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mchip { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 4px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; font: inherit; font-size: .82rem; }
.mchip b { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 1.15rem; text-transform: uppercase; color: var(--fg); }
.mchip .last { font-family: var(--mono); color: var(--muted); }
.mchip[aria-pressed="true"] { border-color: var(--accent); background: var(--tip-bg); }
.mchip[aria-pressed="true"] .last { color: var(--accent); }
.mchip:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.tip ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.mdone { width: 100%; margin-top: 18px; }
.mdone.saved { background: var(--done); }
h1 { font-size: clamp(1.8rem, 9vw, 2.6rem); min-width: 0; }
.model { flex: none; font-size: .7rem; }
.mchip { min-width: 0; overflow-wrap: anywhere; }
#ov-bike { width: 100%; }
.cam { position: relative; width: 100%; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: radial-gradient(90% 80% at 50% 60%, #1a1a1f, var(--black)); }
#ov-bike svg { width: 100%; height: auto; max-height: none; aspect-ratio: 600 / 340; overflow: hidden; }
.cam-cap { position: absolute; left: 0; top: 0; right: 0; padding: 8px 10px 22px; background: linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,.55) 60%, transparent); display: grid; justify-items: start; text-align: left; gap: 0; font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; }
.cam-cap b { color: var(--accent); font-size: .8rem; }
.cam-cap span { font-weight: 800; font-style: italic; font-size: 1.2rem; line-height: 1; }
.cam-cap small { font-family: var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); font-size: .78rem; }
.ov.finished .cam-cap b { color: var(--done); }
#gauge { max-height: 26vh; }
.bike .part[data-hl] { animation: hlpulse 1s ease-in-out infinite alternate; }
.bike .part[data-hl] circle, .bike .part[data-hl] path, .bike .part[data-hl] rect { stroke: #ff5a1f; }
.bike .part[data-hl] .pb { fill: #4a1c0a; }
@keyframes hlpulse { from { opacity: 1; } to { opacity: .55; } }
.mbike { background: radial-gradient(90% 80% at 50% 60%, var(--surface-2), var(--bg)); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-top: 18px; }
.mbike svg { width: 100%; height: auto; display: block; }
.mwhere { font-family: var(--display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); text-align: center; font-size: .9rem; margin-top: 4px; }
@media (prefers-reduced-motion: reduce) { .bike .part[data-hl] { animation: none; } }
.has3d > svg { display: none !important; }
.has3d > canvas { width: 100%; height: auto; aspect-ratio: 600 / 340; display: block; }

/* --- Race-animaties --- */
html, body { overflow-x: hidden; }
@keyframes rx-in { from { opacity: 0; transform: translateX(calc(var(--d, 1) * 34px)) skewX(calc(var(--d, 1) * -8deg)); } to { opacity: 1; transform: none; } }
@keyframes rx-up { from { opacity: 0; transform: translateY(14px) skewX(-6deg); } to { opacity: 1; transform: none; } }
@keyframes rx-flag { from { transform: translateX(-110%) skewX(-20deg); } to { transform: translateX(210%) skewX(-20deg); } }
@keyframes rx-pop { 0% { transform: scale(.6); } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes rx-ring { from { box-shadow: 0 0 0 0 rgba(57,210,122,.7); } to { box-shadow: 0 0 0 16px rgba(57,210,122,0); } }
@keyframes rx-sweep { from { background-position: -100% 0; } to { background-position: 200% 0; } }
@keyframes rx-rev { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 45% { transform: rotate(10deg); } 70% { transform: rotate(-4deg); } }
@keyframes rx-shine { 0%,70% { transform: translateX(-120%) skewX(-25deg); } 100% { transform: translateX(260%) skewX(-25deg); } }
@keyframes rx-spark { to { transform: translate(var(--x), var(--y)) scale(.2); opacity: 0; } }
@keyframes rx-check { from { background-position: 0 0; } to { background-position: 20px 0; } }
.tab { position: relative; overflow: hidden; transition: transform .15s, background .25s, color .25s; }
.tab::after { content: ""; position: absolute; inset: 0; width: 50%; background: repeating-conic-gradient(#000 0 25%, #fff 0 50%) 0 0 / 8px 8px; opacity: 0; pointer-events: none; }
.tab.rx-go::after { opacity: .35; animation: rx-flag .45s ease-out forwards; }
.tab:active, .btn:active, .mode:active, .mchip:active, .reset:active { transform: scale(.95) skewX(-4deg); }
.btn, .mode, .mchip, .reset { transition: transform .12s, background .2s, border-color .2s; }
.btn { position: relative; overflow: hidden; }
.btn::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: rx-shine 3.2s ease-in-out infinite; pointer-events: none; }
.mode[aria-checked="true"] { animation: rx-pop .35s ease-out; box-shadow: 0 0 14px rgba(255,90,31,.35); }
.rx-enter > * { animation: rx-in .38s cubic-bezier(.2,.9,.3,1.2) both; animation-delay: calc(var(--i, 0) * 45ms); }
.rx-enter .row { animation: rx-up .32s ease-out both; animation-delay: calc(120ms + var(--i, 0) * 28ms); }
.row.checked input { animation: rx-pop .35s ease-out, rx-ring .6s ease-out; }
.row.rx-done { background-image: linear-gradient(100deg, transparent 30%, rgba(57,210,122,.35) 50%, transparent 70%); background-size: 50% 100%; background-repeat: no-repeat; animation: rx-sweep .6s ease-out; }
.track.full .fill { background: repeating-linear-gradient(90deg, #fff 0 5px, #000 5px 10px); background-size: 20px 100%; animation: rx-check .4s linear infinite; }
.logo { transform-origin: 50% 60%; }
.logo.rx-rev { animation: rx-rev .6s ease-out; }
.tabs .tab { animation: rx-up .4s ease-out both; }
.tabs .tab:nth-child(2) { animation-delay: .07s; } .tabs .tab:nth-child(3) { animation-delay: .14s; }
.rx-spark { position: fixed; z-index: 98; width: 4px; height: 4px; border-radius: 1px; background: var(--accent); pointer-events: none; box-shadow: 0 0 6px var(--accent); animation: rx-spark .45s ease-out forwards; }
@media (prefers-reduced-motion: reduce) { .rx-enter > *, .rx-enter .row, .tabs .tab, .btn::after, .track.full .fill, .row.checked input, .mode[aria-checked="true"] { animation: none !important; } .rx-spark { display: none; } }
</style>
</head>

<div id="err" hidden style="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#ff2d3d;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));font:600 14px system-ui">Er ging iets mis: <span id="err-msg"></span></div>
<script>
window.addEventListener("error", e => { try { document.getElementById("err-msg").textContent = (e.message || "onbekende fout") + " (r. " + (e.lineno || "?") + ")"; document.getElementById("err").hidden = false; } catch (x) {} });
</script>

  <div class="head">
    <h1><img class="logo" src="logo.svg" alt="" width="40" height="40">Rit<span>-</span>check</h1>

</div>

<script>
/* 2D Sherco SM-R (zijaanzicht links). Onderdelen hebben data-part zodat ze kunnen oplichten. */
function bikeSVG(pf) {
  // gietvelg met 10 dunne Y-spaken, zoals de SM-R 50
  const spokes = (cx, cy) => Array.from({ length: 5 }, (_, i) => {
    const a = i * 2 * Math.PI / 5 - Math.PI / 2, pts = [];
    const P = (ang, r) => `${(cx + r * Math.cos(ang)).toFixed(1)} ${(cy + r * Math.sin(ang)).toFixed(1)}`;
    return `<path d="M${P(a, 11)} L${P(a - .17, 47)} L${P(a - .05, 47)} L${P(a, 30)} L${P(a + .05, 47)} L${P(a + .17, 47)} Z" fill="#222226" stroke="#45464d" stroke-width="1"/>`;
  }).join("");
  const wheel = (cx, cy, part) => `
    <g class="part" data-part="${part}"><circle class="pb" cx="${cx}" cy="${cy}" r="68" fill="#141416" stroke="#232327" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy}" r="63" fill="none" stroke="#1f1f23" stroke-width="2"/>
      <path d="M${cx - 60} ${cy - 18} A62 62 0 0 1 ${cx - 18} ${cy - 60}" fill="none" stroke="#2e2e33" stroke-width="2"/></g>
    <circle cx="${cx}" cy="${cy}" r="50" fill="none" stroke="#1b1b1e" stroke-width="5"/>
    <circle cx="${cx}" cy="${cy}" r="47.5" fill="none" stroke="#7d7f86" stroke-width="1.4"/>
    ${spokes(cx, cy)}
    <circle cx="${cx}" cy="${cy}" r="11" fill="#1b1b1e" stroke="#3a3b41" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="4" fill="#77787f"/>`;
  const disc = (cx, cy, r) => {

function heatColor(p) {
  const st = [[0, [58, 58, 64]], [.35, [110, 38, 26]], [.7, [214, 72, 26]], [1, [255, 186, 90]]];
  for (let i = 1; i < st.length; i++) if (p <= st[i][0]) {
    const [a, ca] = st[i - 1], [b, cb] = st[i], k = (p - a) / (b - a);
    return `rgb(${ca.map((c, j) => Math.round(c + (cb[j] - c) * k)).join(",")})`;
  }
  return "rgb(255,186,90)";
}
/* Cutscene: camera zoomt per onderdeel in en vult het met warmte */
const BIKE_FULL = [0, 0, 600, 340];
const WARM_STAGES = [
  { name: "Cilinder", note: "De verbranding warmt eerst de cilinder op", box: [240, 109, 180, 102], fill: "cyl" },
  { name: "Motorblok", note: "Dan het blok en de versnellingsbak", box: [190, 170, 200, 113], fill: "case" },
  { name: "Koelvloeistof", note: "De koelvloeistof in de radiateur wordt warm", box: [285, 134, 170, 96], fill: "rad" },
  { name: "Uitlaat", note: "De hete gassen vullen de expansiekamer", box: [140, 160, 280, 159], fill: "exh" },
  { name: "Demper", note: "Tot in de demper achteraan", box: [40, 99, 200, 113], fill: "sil" },
];
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const lerpBox = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const strokeLens = {};
function setPartFill(pf, key, f) {
  const el = id => document.getElementById(pf + "-" + id);
  if (key === "exh" || key === "sil") {
    const path = el(key + "f"); if (!path) return;
    let L = strokeLens[pf + key];
    if (!L) { try { L = path.getTotalLength(); } catch (e) { L = 0; } if (L) strokeLens[pf + key] = L; }
    if (!L) return;
    path.setAttribute("stroke-dasharray", L); path.setAttribute("stroke-dashoffset", (L * (1 - f)).toFixed(1));
    path.setAttribute("stroke-opacity", f > 0 ? 1 : 0);
  } else {
    const r = el("cr-" + key); if (!r) return;
    const bottom = { cyl: 194, case: 265, rad: 214 }[key], top = { cyl: 132, case: 186, rad: 148 }[key];
    const h = (bottom - top) * f; r.setAttribute("y", bottom - h); r.setAttribute("height", h);
  }
}
/* p = 0..1 warmte; outro = 0..1 uitzoomen na het einde. Geeft de actieve stage terug. */
function setBikeWarm(pf, p, outro) {
  const svg = document.querySelector("#ov-bike svg"); const N = WARM_STAGES.length;
  const idx = Math.min(N - 1, Math.floor(p * N)), u = p * N - idx;
  WARM_STAGES.forEach((st, i) => setPartFill(pf, st.fill, i < idx ? 1 : i > idx ? 0 : smooth((u - .15) / .85)));
  let box;
  if (outro != null) { WARM_STAGES.forEach(st => setPartFill(pf, st.fill, 1)); box = lerpBox(WARM_STAGES[N - 1].box, BIKE_FULL, smooth(outro)); }
  else box = lerpBox(idx ? WARM_STAGES[idx - 1].box : BIKE_FULL, WARM_STAGES[idx].box, smooth(u / .2));
  if (svg) svg.setAttribute("viewBox", box.map(v => v.toFixed(1)).join(" "));
  const g = document.getElementById(pf + "-exhglow"); if (g) g.setAttribute("opacity", outro != null ? (.8 * smooth(outro)).toFixed(2) : 0);
  return outro != null ? null : WARM_STAGES[idx];
}

<script>
/* Timer apart: als hier iets misgaat, blijft de checklist gewoon werken */
/* --- Toerenteller --- */
const CX = 150, CY = 150, R = 110, A0 = -210, A1 = 30;
const pt = (deg, r) => { const a = deg * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };
function arcPath(from, to, r) {
  const [x1, y1] = pt(from, r), [x2, y2] = pt(to, r);
  return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${to - from > 180 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}
function gaugeSVG() {
  let ticks = "";
  for (let i = 0; i <= 12; i++) {
    const d = A0 + (A1 - A0) * i / 12, [x1, y1] = pt(d, R - 24), [x2, y2] = pt(d, R - (i % 2 ? 32 : 38));
    ticks += `<line class="tick${i >= 10 ? " red" : ""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if (i % 2 === 0) { const [tx, ty] = pt(d, R - 52); ticks += `<text class="num" x="${tx}" y="${ty + 4}">${i}</text>`; }
  }
  return `<svg id="gauge" viewBox="0 0 300 225" aria-hidden="true">
    <path class="arc-bg" d="${arcPath(A0, A1, R)}"/>
    <path class="arc" id="warm-arc" d="${arcPath(A0, A1, R)}"/>
    ${ticks}
    <text class="lbl" x="150" y="118">X1000 RPM</text>
    <line class="needle" id="warm-needle" x1="150" y1="150" x2="150" y2="60"/>
    <circle class="hub" cx="150" cy="150" r="8"/>
    <text class="time" id="warm-time" x="150" y="210">1:30</text>
  </svg>`;
}
document.getElementById("gauge-wrap").innerHTML = gaugeSVG();
document.getElementById("ov-bike").innerHTML = bikeSVG("ob");
const ov = document.getElementById("ov"), arcEl = document.getElementById("warm-arc"), needle = document.getElementById("warm-needle"), gauge = document.getElementById("gauge");
const arcLen = R * (A1 - A0) * Math.PI / 180;

/* --- Effecten (canvas) --- */
const cv = document.getElementById("fx"), cx = cv.getContext("2d");
let W = 0, H = 0, parts = [], rings = [], smoke = [], smokeAcc = 0, spawnAcc = 0, lastRing = 0, lastT = 0;
function sizeCanvas() { const d = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", () => { if (!ov.hidden) sizeCanvas(); });
function gaugeCenter() { const r = gauge.getBoundingClientRect(), o = ov.getBoundingClientRect(); return [r.left - o.left + r.width * .5, r.top - o.top + r.height * (150 / 225)]; }
function spawnEmber(p) {
  parts.push({ x: Math.random() * W, y: H + 10, vx: (Math.random() - .5) * 30, vy: -(40 + Math.random() * 120 * (0.5 + p)), life: 1, decay: .25 + Math.random() * .35, size: 1 + Math.random() * (2 + 3 * p), hue: 15 + Math.random() * 30 });
}
function burst() {
  const [gx, gy] = gaugeCenter();
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 420;
    parts.push({ x: gx, y: gy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: .45 + Math.random() * .5, size: 2 + Math.random() * 4, hue: [145, 30, 0][i % 3], light: i % 3 === 2 ? 95 : 60, grav: 260 });
  }
  for (let i = 0; i < 3; i++) rings.push({ r: 40 + i * 30, a: 1, green: true, speed: 380 - i * 60 });
}
function fxFrame(t, p, running) {
  const dt = Math.min(.05, (t - (lastT || t)) / 1000); lastT = t;
  cx.clearRect(0, 0, W, H);
  if (running && !reduced) {
    spawnAcc += dt * (2 + 60 * p * p); while (spawnAcc > 1) { spawnEmber(p); spawnAcc--; }
    const interval = 1100 - 800 * p; // pulsen gaan sneller naarmate hij warmer wordt
    if (t - lastRing > interval) { rings.push({ r: 60, a: .25 + .55 * p, speed: 120 + 260 * p }); lastRing = t; }

  const tip = document.getElementById("ob-tip");
  const camR = document.getElementById("ov-bike").getBoundingClientRect(), tr0 = tip && tip.getBoundingClientRect();
  if (running && !reduced && tip && tr0.left > camR.left && tr0.left < camR.right && tr0.top > camR.top && tr0.top < camR.bottom) {
    const tr = tr0, o = ov.getBoundingClientRect();

  }

  for (const q of smoke) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.r += 14 * dt; q.a *= Math.pow(.35, dt);
    cx.fillStyle = `rgba(170,172,180,${q.a})`; cx.beginPath(); cx.arc(q.x, q.y, q.r, 0, Math.PI * 2); cx.fill();

/* --- Timer --- */

function stageFor(p) {
  const m = MODES[modeIdx];

  if (p < 2 / 3) return ["Lauw", m.choke ? "Loopt hij rustig zonder te sputteren? Dan mag de choke er stilaan af." : "Zet ondertussen je helm op."];
  return ["Bijna warm", "Handschoenen aan. Nog even en je kan vertrekken."];
}
function drawGauge(p, t, finished) {
  arcEl.style.strokeDasharray = arcLen; arcEl.style.strokeDashoffset = arcLen * (1 - p);
  if (!finished) {
    arcEl.style.stroke = `hsl(${22 - 20 * p} 100% ${55 + 5 * p}%)`;
    arcEl.style.filter = reduced ? "" : `drop-shadow(0 0 ${3 + 16 * p}px hsl(${22 - 20 * p} 100% 55%))`;
  } else { arcEl.style.stroke = ""; arcEl.style.filter = reduced ? "" : "drop-shadow(0 0 14px #39d27a)"; }
  // naald: stationair rond 1/4, trilt harder en zakt iets hoger naarmate hij warm wordt; bij klaar een gasstoot
  let target;
  if (finished) { const k = Math.min(1, (t - endAt) / 900); target = k < .35 ? .26 + (.95 - .26) * (k / .35) : .95 - (.95 - .3) * ((k - .35) / .65); }
  else target = .24 + .06 * p + (reduced ? 0 : Math.sin(t / (70 - 35 * p)) * (.006 + .02 * p));
  needle.setAttribute("transform", `rotate(${A0 + (A1 - A0) * target + 90} 150 150)`);
  if (!reduced && !finished) { const a = .3 + 2.6 * p * p; gauge.style.transform = `translate(${(Math.random() - .5) * a}px, ${(Math.random() - .5) * a}px)`; }
  else gauge.style.transform = "";
  ov.style.setProperty("--p", finished ? 1 : p.toFixed(3));
  const outro = finished ? Math.min(1, (t - endAt) / 1400) : null;
  const st = setBikeWarm("ob", finished ? 1 : p, outro);
  try { if (window.bike3d) window.bike3d.warm(document.getElementById("ov-bike"), finished ? 1 : p, outro); } catch (e) {}
  if (st) { document.getElementById("cam-step").textContent = (WARM_STAGES.indexOf(st) + 1) + "/" + WARM_STAGES.length; document.getElementById("cam-name").textContent = st.name; document.getElementById("cam-note").textContent = st.note; }
  else { document.getElementById("cam-step").textContent = "Klaar"; document.getElementById("cam-name").textContent = "Heel het systeem warm"; document.getElementById("cam-note").textContent = ""; }
}
function loop(t) {
  if (phase === "running") {
    const left = warmSecs - (Date.now() - warmStart) / 1000;
    if (left <= 0) { finish(t); }
    else {
      const p = 1 - left / warmSecs, [stage, msg] = stageFor(p), lvl = Math.min(2, Math.floor(p * 3));
      drawGauge(p, t, false);
      document.getElementById("warm-time").textContent = fmt(left);
      document.getElementById("ov-stage").textContent = stage;
      const m = document.getElementById("ov-msg"); if (m.textContent !== msg) m.textContent = msg;
      leds.forEach((l, i) => { l.classList.toggle("on", i <= lvl); l.classList.toggle("cur", i === lvl); });
      fxFrame(t, p, true);

function beep() {

  ov.classList.add("finished");
  document.getElementById("warm-time").textContent = "GO";
  document.getElementById("ov-stage").textContent = "Opgewarmd";
  document.getElementById("ov-msg").textContent = "Klaar om te vertrekken. Rij de eerste kilometers nog rustig, dan is hij helemaal op temperatuur.";
  document.getElementById("ov-stop").textContent = "Rijden!";
  document.getElementById("ov-flag").hidden = false;
  if (!reduced) burst();
  beep();
  state["s-warm"] = true; save(); updaters.start();
}
function closeOverlay() {
  phase = "idle"; cancelAnimationFrame(raf);
  ov.classList.remove("show");
  document.body.classList.remove("locked");
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  try { wakeLock?.release(); } catch (e) {} wakeLock = null;
  setTimeout(() => { if (phase === "idle") { ov.hidden = true; cx.clearRect(0, 0, W, H); } }, reduced ? 0 : 800);
}
document.getElementById("ov-stop").addEventListener("click", closeOverlay);
document.addEventListener("visibilitychange", async () => { if (!document.hidden && phase === "running") { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {} } });

document.getElementById("warm-go").addEventListener("click", startWarm);
</script>
<script>
/* Geen zoom en geen selecteren (ook voor iOS Safari, dat de viewport-meta negeert) */
["gesturestart","gesturechange","gestureend"].forEach(e => document.addEventListener(e, ev => ev.preventDefault()));
document.addEventListener("touchmove", ev => { if (ev.touches.length > 1) ev.preventDefault(); }, { passive: false });
document.addEventListener("selectstart", ev => ev.preventDefault());
document.addEventListener("contextmenu", ev => ev.preventDefault());
document.addEventListener("dblclick", ev => ev.preventDefault());
</script>
<script>
/* --- Race-animaties: los blok, faalt stil --- */
(function () { try {
  var order = ["start", "end", "maint"], cur = null, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function vis() { for (var i = 0; i < order.length; i++) { var el = document.getElementById("pane-" + order[i]); if (el && !el.hidden) return order[i]; } }
  function enter(name, dir) {
    var pane = document.getElementById("pane-" + name); if (!pane) return;
    pane.style.setProperty("--d", dir);
    [].forEach.call(pane.children, function (c, i) { c.style.setProperty("--i", Math.min(i, 8)); });
    pane.querySelectorAll(".row").forEach(function (r, i) { r.style.setProperty("--i", Math.min(i, 14)); });
    pane.classList.remove("rx-enter"); void pane.offsetWidth; pane.classList.add("rx-enter");
    clearTimeout(pane._rx); pane._rx = setTimeout(function () { pane.classList.remove("rx-enter"); }, 1200);
  }
  function sparks(x, y, n, col) {
    if (reduce) return;
    for (var i = 0; i < n; i++) {
      var s = document.createElement("i"), a = Math.random() * Math.PI * 2, r = 18 + Math.random() * 26;
      s.className = "rx-spark"; s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--x", Math.cos(a) * r + "px"); s.style.setProperty("--y", Math.sin(a) * r + "px");
      if (col) { s.style.background = col; s.style.boxShadow = "0 0 6px " + col; }
      document.body.appendChild(s); setTimeout(function (el) { el.remove(); }.bind(null, s), 500);
    }
  }
  function fullCheck() { document.querySelectorAll(".track").forEach(function (t) { var f = t.querySelector(".fill"); t.classList.toggle("full", !!f && f.style.width === "100%"); }); }
  cur = vis(); enter(cur, 1); fullCheck();
  var logo = document.querySelector(".logo");
  if (logo) { logo.classList.add("rx-rev"); logo.addEventListener("click", function () { logo.classList.remove("rx-rev"); void logo.offsetWidth; logo.classList.add("rx-rev"); }); }
  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest(".tab");
    if (t) setTimeout(function () {
      var now = vis(); if (now === cur) return;
      var dir = order.indexOf(now) > order.indexOf(cur) ? 1 : -1; cur = now;
      t.classList.remove("rx-go"); void t.offsetWidth; t.classList.add("rx-go"); enter(now, dir);
    }, 0);
    if (e.target.closest && e.target.closest(".reset, #mreset")) setTimeout(fullCheck, 0);
  });
  document.addEventListener("pointerdown", function (e) {
    var b = e.target.closest && e.target.closest("button, .row, .mchip");
    if (b) { sparks(e.clientX, e.clientY, 5); try { navigator.vibrate && navigator.vibrate(8); } catch (x) {} }
  }, { passive: true });
  document.addEventListener("change", function (e) {
    var box = e.target; if (!box.matches || !box.matches(".row input")) return;
    setTimeout(fullCheck, 0);
    if (!box.checked) return;
    var row = box.closest(".row"), r = box.getBoundingClientRect();
    row.classList.remove("rx-done"); void row.offsetWidth; row.classList.add("rx-done");
    setTimeout(function () { row.classList.remove("rx-done"); }, 700);
    sparks(r.left + r.width / 2, r.top + r.height / 2, 9, "#39d27a");
  });
} catch (e) {} })();
</script>
<script>
/* Live update: kijkt bij openen en bij terugkeren naar de app of er een nieuwere versie op GitHub staat */
const APP_VERSION = 16;
async function checkUpdate() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const { v } = await r.json();
    const u = new URL(location.href);
    if (v > APP_VERSION && u.searchParams.get("v") !== String(v)) { // nooit eindeloos herladen
      u.searchParams.set("v", v);
      location.replace(u.toString());
    }
  } catch (e) {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
</script>
