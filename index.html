<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rit-check">
<title>Sherco Rit-check</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: één kolom als een motordashboard. Bewust donker (Blackmoon), racing-oranje accent. De opwarmtimer neemt het hele scherm over. */
:root {
  color-scheme: dark;
  --bg: #0b0b0d; --black: #000000; --surface: #16161a; --surface-2: #1e1e24; --fg: #f2f2f4; --muted: #8f909a; --line: #2a2a31;
  --accent: #ff5a1f; --accent-ink: #0b0b0d; --done: #39d27a; --done-bg: #10261a; --red: #ff2d3d; --tip-bg: #221a10; --tip-fg: #ffc46b;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  --mono: "Share Tech Mono", ui-monospace, monospace;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body.locked { overflow: hidden; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 3px solid var(--accent); position: relative; }
.head::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 3px; background: repeating-linear-gradient(90deg, var(--fg) 0 6px, transparent 6px 12px); opacity: .25; }
h1 { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 2.6rem; letter-spacing: .01em; text-transform: uppercase; margin: 0; line-height: .9; }
h1 span { color: var(--accent); }
.model { font-family: var(--mono); color: var(--muted); font-size: .8rem; text-align: right; line-height: 1.3; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 22px; }
.tab { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line); border-radius: 4px; padding: 10px 8px; background: var(--surface); color: var(--muted); cursor: pointer; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab:focus-visible, .row:focus-within, .btn:focus-visible, .mode:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

.bar { display: flex; align-items: center; gap: 12px; margin: 18px 0 4px; }
.track { flex: 1; height: 10px; background: var(--surface-2); overflow: hidden; transform: skewX(-20deg); }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--done), var(--done) 70%, var(--accent)); transition: width .3s; }
.count { font-family: var(--mono); color: var(--muted); font-size: 1rem; min-width: 3.5em; text-align: right; }

.group { margin-top: 20px; }
.group h2 { font-family: var(--display); font-weight: 700; font-size: .95rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.list { display: grid; gap: 6px; }
.row { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 4px; padding: 12px 14px; cursor: pointer; transition: background .2s, border-color .2s; }
.row input { appearance: none; flex: none; width: 26px; height: 26px; margin: 0; border: 2px solid var(--muted); border-radius: 50%; display: grid; place-content: center; cursor: pointer; }
.row input:checked { background: var(--done); border-color: var(--done); }
.row input:checked::after { content: ""; width: 6px; height: 12px; border: solid var(--bg); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.row.checked { background: var(--done-bg); border-left-color: var(--done); }
.row.checked .what { text-decoration: line-through; color: var(--muted); }
.txt { min-width: 0; }
.what { font-weight: 600; }
.why { color: var(--muted); font-size: .88rem; }
.row.lock .what::before { content: "SLOT"; font-family: var(--display); font-weight: 700; font-size: .72rem; letter-spacing: .1em; background: var(--red); color: var(--fg); border-radius: 2px; padding: 1px 5px; margin-right: 7px; vertical-align: 2px; }

/* Opwarmkaart in de lijst */
.warm { background: radial-gradient(120% 90% at 50% 0%, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 12px; margin-bottom: 6px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mode { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 4px; padding: 8px 4px; cursor: pointer; display: grid; gap: 2px; font: inherit; }
.mode b { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .03em; color: var(--fg); }
.mode span { font-family: var(--mono); font-size: .85rem; }
.mode[aria-checked="true"] { border-color: var(--accent); background: var(--tip-bg); }
.mode[aria-checked="true"] span { color: var(--accent); }
.warm p { margin: 0; color: var(--muted); font-size: .88rem; }
.btn { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 1.25rem; letter-spacing: .06em; text-transform: uppercase; border: 0; border-radius: 4px; padding: 13px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }

/* Fullscreen timer */
.ov { position: fixed; inset: 0; z-index: 50; background: var(--black); opacity: 0; transition: opacity .8s ease; display: grid; place-items: center; overflow: hidden;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); --p: 0; }
.ov.show { opacity: 1; }
.ov canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ov-glow { position: absolute; inset: -10%; pointer-events: none; background: radial-gradient(circle at 50% 42%, var(--accent), transparent 55%); opacity: calc(var(--p) * .38); }
.ov.finished .ov-glow { background: radial-gradient(circle at 50% 42%, var(--done), transparent 55%); opacity: .35; }
.ov-in { position: relative; display: grid; justify-items: center; gap: 14px; width: min(100%, 520px); text-align: center; }
.ov-mode { font-family: var(--display); font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); font-size: .9rem; }
.ov svg { width: 100%; max-height: 52vh; display: block; overflow: visible; }
.ov .tick { stroke: var(--muted); stroke-width: 2; }
.ov .tick.red { stroke: var(--red); }
.ov .num { fill: var(--muted); font-family: var(--mono); font-size: 13px; text-anchor: middle; }
.ov .arc-bg { fill: none; stroke: var(--surface-2); stroke-width: 14; }
.ov .arc { fill: none; stroke: var(--accent); stroke-width: 14; }
.ov .needle { stroke: var(--red); stroke-width: 4; stroke-linecap: round; }
.ov .hub { fill: var(--fg); }
.ov .time { fill: var(--fg); font-family: var(--mono); font-size: 40px; text-anchor: middle; }
.ov .lbl { fill: var(--muted); font-family: var(--display); font-weight: 700; letter-spacing: .15em; font-size: 12px; text-anchor: middle; }
.ov.finished .arc { stroke: var(--done) !important; }
.ov.finished .time { fill: var(--done); font-family: var(--display); font-weight: 800; font-style: italic; font-size: 64px; }
.leds { display: flex; gap: 8px; }
.led { width: 64px; height: 10px; background: var(--surface-2); transform: skewX(-20deg); transition: background .4s, box-shadow .4s; }
.led.on { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.led.cur { animation: blink .7s infinite alternate; }
.ov.finished .led { background: var(--done); box-shadow: 0 0 14px var(--done); animation: none; }
@keyframes blink { to { opacity: .35; } }
.stage { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 1.6rem; letter-spacing: .04em; line-height: 1; }
.ov.finished .stage { color: var(--done); font-size: 2.2rem; }
.ov-msg { margin: 0; color: var(--muted); max-width: 34ch; min-height: 2.9em; }
.ov .btn { width: 100%; max-width: 320px; }
.ov .btn.stop { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.ov.finished .btn.stop { background: var(--done); color: var(--accent-ink); border-color: var(--done); }
.flagstrip { height: 22px; width: 100%; background: conic-gradient(var(--fg) 25%, var(--black) 0 50%, var(--fg) 0 75%, var(--black) 0) 0 0 / 22px 22px; animation: wave 1s linear infinite; }

/* Finish onder de lijst */
.ready { margin-top: 18px; border-radius: 6px; overflow: hidden; border: 1px solid var(--done); }
.flag { height: 28px; background: conic-gradient(var(--fg) 25%, var(--bg) 0 50%, var(--fg) 0 75%, var(--bg) 0) 0 0 / 28px 28px; animation: wave 1.2s linear infinite; }
@keyframes wave { to { background-position: 28px 0; } }
.ready .msg { background: var(--done-bg); padding: 14px; text-align: center; }
.ready .big { display: block; font-family: var(--display); font-weight: 800; font-style: italic; font-size: 1.9rem; text-transform: uppercase; color: var(--done); line-height: 1; }
.ready .small { color: var(--fg); font-size: .95rem; }
.ready:not([hidden]) { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.92); opacity: .4; } to { transform: none; opacity: 1; } }

.tip { margin-top: 16px; padding: 12px 14px; border-radius: 4px; background: var(--tip-bg); color: var(--tip-fg); font-size: .9rem; border-left: 4px solid var(--tip-fg); }
.reset { margin-top: 18px; width: 100%; padding: 12px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 600 1rem var(--body); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .fill, .row, .ov, .led { transition: none; } .flag, .flagstrip, .led.cur, .ready:not([hidden]) { animation: none; } }
html { background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body, .ov { touch-action: manipulation; }
.ov { padding-top: 16px; padding-bottom: 16px; }
h1 { display: flex; align-items: center; gap: 10px; }
.logo { width: 40px; height: 40px; border-radius: 10px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <h1><img class="logo" src="logo.svg" alt="" width="40" height="40">Rit<span>-</span>check</h1>
    <div class="model">SHERCO 50 SM-R<br>BLACKMOON '23</div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-start" aria-selected="true" data-pane="start">Vertrek</button>
    <button class="tab" role="tab" id="tab-end" aria-selected="false" data-pane="end">Terug</button>
  </div>

  <section id="pane-start" role="tabpanel" aria-labelledby="tab-start"></section>
  <section id="pane-end" role="tabpanel" aria-labelledby="tab-end" hidden></section>
</div>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-label="Opwarmen">
  <div class="ov-glow"></div>
  <canvas id="fx"></canvas>
  <div class="ov-in">
    <div class="ov-mode" id="ov-mode">Normaal · 1:30</div>
    <div id="gauge-wrap"></div>
    <div class="leds"><div class="led"></div><div class="led"></div><div class="led"></div></div>
    <div class="stage" id="ov-stage">Koud</div>
    <p class="ov-msg" id="ov-msg"></p>
    <div class="flagstrip" id="ov-flag" hidden></div>
    <button class="btn stop" id="ov-stop" type="button">Stop timer</button>
  </div>
</div>

<script>
const lists = {
  start: {
    groups: [
      { title: "Sloten eraf", items: [
        { id: "s-schijf", lock: true, what: "Remschijfslot eraf", why: "Rij je ermee weg, dan blokkeert je wiel en kan je remschijf kapot." },
        { id: "s-achter", lock: true, what: "Achterwielslot eraf", why: "Zelfde verhaal: wiel moet vrij draaien." },
        { id: "s-stuur", lock: true, what: "Stuurslot (wieldraaislot) los", why: "Anders kan je niet sturen." },
      ]},
      { title: "Bijvullen", items: [
        { id: "s-benzine", what: "Genoeg benzine", why: "Tank bij als hij onder de helft zit, dan sta je nooit stil." },
        { id: "s-olie", what: "2T-olietankje niet bijna leeg", why: "Zonder olie kan je motor vastlopen." },
      ]},
      { title: "Kort nakijken", items: [
        { id: "s-remmen", what: "Voor- en achterrem knijpen", why: "Moeten stevig aanvoelen, niet zacht of sponzig." },
        { id: "s-banden", what: "Banden zien er goed uit", why: "Niet plat, geen scheuren of iets dat erin steekt." },
        { id: "s-ketting", what: "Ketting niet te slap of droog", why: "Max 2 cm speling; droog of roestig, dan eerst spray." },
        { id: "s-licht", what: "Lichten en pinkers doen het", why: "Koplicht, achterlicht, remlicht en pinkers, zodat ze je zien." },
        { id: "s-lek", what: "Geen vlekken onder de moto", why: "Een plasje olie of koelvloeistof is een teken dat er iets lekt." },
      ]},
      { title: "Jezelf", items: [
        { id: "s-gear", what: "Helm, handschoenen, jas", why: "Ook voor een kort ritje." },
        { id: "s-papier", what: "Rijbewijs en papieren bij", why: "Inschrijving en verzekering, voor als je gecontroleerd wordt." },
      ]},
      { title: "Starten", warm: true, items: [
        { id: "s-warm", what: "Motor opgewarmd", why: "Kies hierboven hoe koud het is en start de timer. Vinkt zichzelf af als hij klaar is." },
        { id: "s-stand", what: "Zijstandaard omhoog", why: "Laatste ding voor je vertrekt." },
      ]},
    ],
    big: "Klaar om te rijden",
    small: "Alles gecheckt. Goeie rit en rij veilig!",
    tip: "Tip: hang een fel gekleurde herinneringskabel van je remschijfslot naar je stuur. Dan kan je het niet vergeten."
  },
  end: {
    groups: [
      { title: "Parkeren", items: [
        { id: "e-uit", what: "Motor uit, sleutel eruit", why: "Laat de sleutel nooit op de moto zitten." },
        { id: "e-plek", what: "Op een vaste, vlakke plek", why: "Zodat hij niet omvalt op de standaard." },
      ]},
      { title: "Sloten erop", items: [
        { id: "e-stuur", lock: true, what: "Stuurslot (wieldraaislot) op", why: "Draai je stuur helemaal opzij en zet het slot." },
        { id: "e-schijf", lock: true, what: "Remschijfslot erop", why: "Hang er je herinneringskabel aan naar het stuur." },
        { id: "e-achter", lock: true, what: "Achterwielslot erop", why: "Liefst vast aan iets dat niet beweegt." },
      ]},
      { title: "Even nakijken", items: [
        { id: "e-benzine", what: "Benzine en 2T-olie bijna op?", why: "Onthoud het, dan tank je bij voor je volgende rit." },
        { id: "e-ketting", what: "Nat gereden? Ketting sprayen", why: "Na regen roest je ketting snel, spray hem als hij wat afgekoeld is." },
        { id: "e-schade", what: "Niets los, lek of kapot", why: "Iets raar gehoord of gevoeld onderweg? Kijk het nu na." },
        { id: "e-km", what: "Kilometerstand bekeken", why: "Om de 4000 km moet hij binnen voor een beurt." },
      ]},
    ],
    big: "Geparkeerd en op slot",
    small: "Mooi gereden. Tot de volgende rit!",
    tip: "Pak de moto niet af met een hogedrukspuit op lagers en elektriek. Een emmer en spons is genoeg."
  }
};

const MODES = [
  { secs: 60, name: "Warm weer", hint: "Boven 15°C" },
  { secs: 90, name: "Normaal", hint: "5 tot 15°C" },
  { secs: 120, name: "Koud", hint: "Choke aan", choke: true },
];

const KEY = "sherco-ritcheck-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
let modeIdx = Number.isInteger(state._mode) && MODES[state._mode] ? state._mode : 1;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* --- Toerenteller --- */
const CX = 150, CY = 150, R = 110, A0 = -210, A1 = 30;
const pt = (deg, r) => { const a = deg * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };
function arcPath(from, to, r) {
  const [x1, y1] = pt(from, r), [x2, y2] = pt(to, r);
  return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${to - from > 180 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}
function gaugeSVG() {
  let ticks = "";
  for (let i = 0; i <= 12; i++) {
    const d = A0 + (A1 - A0) * i / 12, [x1, y1] = pt(d, R - 24), [x2, y2] = pt(d, R - (i % 2 ? 32 : 38));
    ticks += `<line class="tick${i >= 10 ? " red" : ""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if (i % 2 === 0) { const [tx, ty] = pt(d, R - 52); ticks += `<text class="num" x="${tx}" y="${ty + 4}">${i}</text>`; }
  }
  return `<svg id="gauge" viewBox="0 0 300 225" aria-hidden="true">
    <path class="arc-bg" d="${arcPath(A0, A1, R)}"/>
    <path class="arc" id="warm-arc" d="${arcPath(A0, A1, R)}"/>
    ${ticks}
    <text class="lbl" x="150" y="118">X1000 RPM</text>
    <line class="needle" id="warm-needle" x1="150" y1="150" x2="150" y2="60"/>
    <circle class="hub" cx="150" cy="150" r="8"/>
    <text class="time" id="warm-time" x="150" y="210">1:30</text>
  </svg>`;
}
document.getElementById("gauge-wrap").innerHTML = gaugeSVG();
const ov = document.getElementById("ov"), arcEl = document.getElementById("warm-arc"), needle = document.getElementById("warm-needle"), gauge = document.getElementById("gauge");
const arcLen = R * (A1 - A0) * Math.PI / 180;
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* --- Effecten (canvas) --- */
const cv = document.getElementById("fx"), cx = cv.getContext("2d");
let W = 0, H = 0, parts = [], rings = [], spawnAcc = 0, lastRing = 0, lastT = 0;
function sizeCanvas() { const d = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", () => { if (!ov.hidden) sizeCanvas(); });
function gaugeCenter() { const r = gauge.getBoundingClientRect(), o = ov.getBoundingClientRect(); return [r.left - o.left + r.width * .5, r.top - o.top + r.height * (150 / 225)]; }
function spawnEmber(p) {
  parts.push({ x: Math.random() * W, y: H + 10, vx: (Math.random() - .5) * 30, vy: -(40 + Math.random() * 120 * (0.5 + p)), life: 1, decay: .25 + Math.random() * .35, size: 1 + Math.random() * (2 + 3 * p), hue: 15 + Math.random() * 30 });
}
function burst() {
  const [gx, gy] = gaugeCenter();
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 420;
    parts.push({ x: gx, y: gy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: .45 + Math.random() * .5, size: 2 + Math.random() * 4, hue: [145, 30, 0][i % 3], light: i % 3 === 2 ? 95 : 60, grav: 260 });
  }
  for (let i = 0; i < 3; i++) rings.push({ r: 40 + i * 30, a: 1, green: true, speed: 380 - i * 60 });
}
function fxFrame(t, p, running) {
  const dt = Math.min(.05, (t - (lastT || t)) / 1000); lastT = t;
  cx.clearRect(0, 0, W, H);
  if (running && !reduced) {
    spawnAcc += dt * (2 + 60 * p * p); while (spawnAcc > 1) { spawnEmber(p); spawnAcc--; }
    const interval = 1100 - 800 * p; // pulsen gaan sneller naarmate hij warmer wordt
    if (t - lastRing > interval) { rings.push({ r: 60, a: .25 + .55 * p, speed: 120 + 260 * p }); lastRing = t; }
  }
  const [gx, gy] = gaugeCenter();
  cx.lineWidth = 2;
  rings = rings.filter(r => r.a > .01);
  for (const r of rings) {
    r.r += r.speed * dt; r.a *= Math.pow(.25, dt);
    cx.strokeStyle = r.green ? `rgba(57,210,122,${r.a})` : `rgba(255,90,31,${r.a})`;
    cx.beginPath(); cx.arc(gx, gy, r.r, 0, Math.PI * 2); cx.stroke();
  }
  parts = parts.filter(q => q.life > 0);
  cx.globalCompositeOperation = "lighter";
  for (const q of parts) {
    q.x += q.vx * dt; q.y += q.vy * dt; if (q.grav) q.vy += q.grav * dt; q.life -= q.decay * dt;
    cx.fillStyle = `hsla(${q.hue},100%,${q.light || 60}%,${Math.max(0, q.life)})`;
    cx.beginPath(); cx.arc(q.x, q.y, q.size, 0, Math.PI * 2); cx.fill();
  }
  cx.globalCompositeOperation = "source-over";
}

/* --- Timer --- */
let warmStart = 0, warmSecs = 90, raf = 0, phase = "idle", wakeLock = null, endAt = 0;
const leds = [...document.querySelectorAll(".led")];
function stageFor(p) {
  const m = MODES[modeIdx];
  if (p < 1 / 3) return ["Koud", m.choke ? "Choke aan, laat hem stationair draaien. Geen gas geven." : "Laat hem stationair draaien. Geen gas geven."];
  if (p < 2 / 3) return ["Lauw", m.choke ? "Loopt hij rustig zonder te sputteren? Dan mag de choke er stilaan af." : "Zet ondertussen je helm op."];
  return ["Bijna warm", "Handschoenen aan. Nog even en je kan vertrekken."];
}
function drawGauge(p, t, finished) {
  arcEl.style.strokeDasharray = arcLen; arcEl.style.strokeDashoffset = arcLen * (1 - p);
  if (!finished) {
    arcEl.style.stroke = `hsl(${22 - 20 * p} 100% ${55 + 5 * p}%)`;
    arcEl.style.filter = reduced ? "" : `drop-shadow(0 0 ${3 + 16 * p}px hsl(${22 - 20 * p} 100% 55%))`;
  } else { arcEl.style.stroke = ""; arcEl.style.filter = reduced ? "" : "drop-shadow(0 0 14px #39d27a)"; }
  // naald: stationair rond 1/4, trilt harder en zakt iets hoger naarmate hij warm wordt; bij klaar een gasstoot
  let target;
  if (finished) { const k = Math.min(1, (t - endAt) / 900); target = k < .35 ? .26 + (.95 - .26) * (k / .35) : .95 - (.95 - .3) * ((k - .35) / .65); }
  else target = .24 + .06 * p + (reduced ? 0 : Math.sin(t / (70 - 35 * p)) * (.006 + .02 * p));
  needle.setAttribute("transform", `rotate(${A0 + (A1 - A0) * target + 90} 150 150)`);
  if (!reduced && !finished) { const a = .3 + 2.6 * p * p; gauge.style.transform = `translate(${(Math.random() - .5) * a}px, ${(Math.random() - .5) * a}px)`; }
  else gauge.style.transform = "";
  ov.style.setProperty("--p", finished ? 1 : p.toFixed(3));
}
function loop(t) {
  if (phase === "running") {
    const left = warmSecs - (Date.now() - warmStart) / 1000;
    if (left <= 0) { finish(t); }
    else {
      const p = 1 - left / warmSecs, [stage, msg] = stageFor(p), lvl = Math.min(2, Math.floor(p * 3));
      drawGauge(p, t, false);
      document.getElementById("warm-time").textContent = fmt(left);
      document.getElementById("ov-stage").textContent = stage;
      const m = document.getElementById("ov-msg"); if (m.textContent !== msg) m.textContent = msg;
      leds.forEach((l, i) => { l.classList.toggle("on", i <= lvl); l.classList.toggle("cur", i === lvl); });
      fxFrame(t, p, true);
    }
  } else if (phase === "finished") { drawGauge(1, t, true); fxFrame(t, 1, false); }
  if (phase !== "idle") raf = requestAnimationFrame(loop);
}
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18, .36].forEach((t, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "square"; o.frequency.value = i === 2 ? 880 : 660;
      g.gain.setValueAtTime(.08, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + .15);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .16);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200, 100, 400]); } catch (e) {}
}
async function startWarm() {
  const m = MODES[modeIdx];
  warmSecs = m.secs; phase = "running"; parts = []; rings = []; lastT = 0; lastRing = 0;
  ov.classList.remove("finished");
  document.getElementById("ov-mode").textContent = `${m.name} · ${fmt(m.secs)}`;
  document.getElementById("ov-stop").textContent = "Stop timer";
  document.getElementById("ov-flag").hidden = true;
  document.getElementById("warm-time").textContent = fmt(m.secs);
  ov.hidden = false; document.body.classList.add("locked");
  sizeCanvas();
  requestAnimationFrame(() => ov.classList.add("show"));
  warmStart = Date.now();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  try { if (ov.requestFullscreen && !document.fullscreenElement) await ov.requestFullscreen(); } catch (e) {}
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
}
function finish(t) {
  phase = "finished"; endAt = t;
  ov.classList.add("finished");
  document.getElementById("warm-time").textContent = "GO";
  document.getElementById("ov-stage").textContent = "Opgewarmd";
  document.getElementById("ov-msg").textContent = "Klaar om te vertrekken. Rij de eerste kilometers nog rustig, dan is hij helemaal op temperatuur.";
  document.getElementById("ov-stop").textContent = "Rijden!";
  document.getElementById("ov-flag").hidden = false;
  if (!reduced) burst();
  beep();
  state["s-warm"] = true; save(); updaters.start();
}
function closeOverlay() {
  phase = "idle"; cancelAnimationFrame(raf);
  ov.classList.remove("show");
  document.body.classList.remove("locked");
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  try { wakeLock?.release(); } catch (e) {} wakeLock = null;
  setTimeout(() => { if (phase === "idle") { ov.hidden = true; cx.clearRect(0, 0, W, H); } }, reduced ? 0 : 800);
}
document.getElementById("ov-stop").addEventListener("click", closeOverlay);
document.addEventListener("visibilitychange", async () => { if (!document.hidden && phase === "running") { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {} } });

/* --- Lijsten --- */
const updaters = {};
function render(name) {
  const cfg = lists[name];
  const pane = document.getElementById("pane-" + name);
  const all = cfg.groups.flatMap(g => g.items);
  pane.innerHTML = `
    <div class="bar"><div class="track"><div class="fill"></div></div><span class="count"></span></div>
    ${cfg.groups.map(g => `
      <div class="group"><h2>${g.title}</h2>
        ${g.warm ? `<div class="warm">
          <div class="modes" role="radiogroup" aria-label="Hoe koud is het?">
            ${MODES.map((m, i) => `<button class="mode" type="button" role="radio" id="mode-${i}" data-i="${i}" aria-checked="${i === modeIdx}"><b>${m.name}</b><span>${fmt(m.secs)}</span><span>${m.hint}</span></button>`).join("")}
          </div>
          <p>Start je motor en druk dan op de knop. Je scherm wordt een grote toerenteller tot hij warm is.</p>
          <button class="btn" id="warm-go" type="button">Start opwarmen</button>
        </div>` : ""}
        <div class="list">
        ${g.items.map(it => `
          <label class="row${it.lock ? " lock" : ""}" for="${it.id}">
            <input type="checkbox" id="${it.id}">
            <span class="txt"><span class="what">${it.what}</span><br><span class="why">${it.why}</span></span>
          </label>`).join("")}
      </div></div>`).join("")}
    <div class="ready" hidden><div class="flag"></div><div class="msg"><span class="big">${cfg.big}</span><span class="small">${cfg.small}</span></div><div class="flag"></div></div>
    <div class="tip">${cfg.tip}</div>
    <button class="reset" id="reset-${name}" type="button">Opnieuw beginnen</button>`;

  const update = () => {
    const n = all.filter(it => state[it.id]).length;
    pane.querySelector(".fill").style.width = (n / all.length * 100) + "%";
    pane.querySelector(".count").textContent = n + "/" + all.length;
    pane.querySelector(".ready").hidden = n !== all.length;
    all.forEach(it => {
      const box = document.getElementById(it.id);
      box.checked = !!state[it.id];
      box.closest(".row").classList.toggle("checked", box.checked);
    });
  };
  updaters[name] = update;
  all.forEach(it => document.getElementById(it.id).addEventListener("change", e => {
    state[it.id] = e.target.checked; save(); update();
  }));
  pane.querySelector(".reset").addEventListener("click", () => {
    all.forEach(it => delete state[it.id]); save(); update();
  });
  update();
}
render("start"); render("end");
document.getElementById("warm-go").addEventListener("click", startWarm);
document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => {
  modeIdx = +b.dataset.i; state._mode = modeIdx; save();
  document.querySelectorAll(".mode").forEach(x => x.setAttribute("aria-checked", String(x === b)));
}));

function show(name) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.pane === name)));
  ["start", "end"].forEach(p => document.getElementById("pane-" + p).hidden = p !== name);
  try { localStorage.setItem(KEY + "-tab", name); } catch (e) {}
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => show(t.dataset.pane)));
const fromHash = location.hash === "#terug" ? "end" : location.hash === "#vertrek" ? "start" : null;
let lastTab = null; try { lastTab = localStorage.getItem(KEY + "-tab"); } catch (e) {}
show(fromHash || (lastTab === "end" ? "end" : "start"));
</script>

/* Geen zoom en geen selecteren (ook voor iOS Safari, dat de viewport-meta negeert) */
["gesturestart","gesturechange","gestureend"].forEach(e => document.addEventListener(e, ev => ev.preventDefault()));
document.addEventListener("touchmove", ev => { if (ev.touches.length > 1) ev.preventDefault(); }, { passive: false });
document.addEventListener("selectstart", ev => ev.preventDefault());
document.addEventListener("contextmenu", ev => ev.preventDefault());
document.addEventListener("dblclick", ev => ev.preventDefault());
</script>
